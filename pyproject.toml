# Packaging metadata for SampleDisco.
# Installable as a normal package (src/ layout): `pip install -e .` exposes the
# `sampledisco` import and the `sampledisco` console command from anywhere — no
# more `cd code && python SampleDisc.py`. Core deps are declared in
# requirements.txt; the full CPU / GPU environments are environment-cpu.yml / environment-gpu.yml.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sampledisco"
version = "0.8.0"
description = "Cross-omics, cross-condition sample embedding for single-cell data (RNA, ATAC, multi-omics)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Harry Jiang", email = "hjiang55@jh.edu" },
    { name = "Hongkai Ji" },
]
keywords = ["single-cell", "sample-embedding", "multi-omics", "scRNA-seq", "scATAC-seq", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["dependencies"]

# Optional feature sets. `pip install "sampledisco[all]"` gives one environment
# that runs every CPU part of the package (RAPIDS GPU stack: environment-gpu.yml).
# Training GLUE additionally needs the bedtools binary: conda install -c bioconda bedtools
[project.optional-dependencies]
# MaxFuse 0.0.2 calls AnnData(arr, dtype=...), which anndata 0.13 removed.
maxfuse = ["maxfuse==0.0.2", "anndata<0.13"]
# scGLUE 0.3.2 imports anndata._core.sparse_dataset.SparseDataset, removed in
# anndata 0.11, and its training calls ReduceLROnPlateau(verbose=...), removed in
# torch 2.7 (its own metadata says only anndata>=0.7, torch>=1.8). harmony-pytorch is a
# core dependency since 0.6.1 (requirements.txt).
glue = ["scglue==0.3.2", "anndata<0.11", "torch<2.7"]
# Same as glue; the name used in older docs and in sampledisco.utils.harmony_compat.
multiomics = ["scglue==0.3.2", "anndata<0.11", "torch<2.7"]
all = [
    "maxfuse==0.0.2",
    "scglue==0.3.2",
    "anndata<0.11",
    "torch<2.7",
]

[project.urls]
Homepage = "https://github.com/J041120h/SampleDisco"
Documentation = "https://j041120h.github.io/SampleDisco_tutorial/"
Repository = "https://github.com/J041120h/SampleDisco"

[project.scripts]
sampledisco = "sampledisco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sampledisco = ["config/*.yaml"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
