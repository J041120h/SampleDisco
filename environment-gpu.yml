# SampleDisco — GPU environment = the CPU environment (environment-cpu.yml) + NVIDIA RAPIDS.
# ONE environment that runs every part of the package, with GPU acceleration.
#
#   conda env create -f environment-gpu.yml && conda activate sampledisco-gpu
#   pip install --no-deps rapids-singlecell==0.13.1 sampledisco==0.6.0
#
# (Creating it on a machine without a GPU? Prefix the first command with
#  CONDA_OVERRIDE_CUDA=12.5.)
#
# Contents: RAPIDS 24.12 (CUDA-12 line, rapidsai channel) + torch 2.5.1+cu121 (pip) +
# everything in the CPU env: the core pipeline, scGLUE 0.3.2 (+ bedtools),
# harmony-pytorch, MaxFuse 0.0.2, and (second command) SampleDisco itself. Same code-validated science pins as the CPU env (numpy 2.0.2 /
# scanpy 1.11.4 / anndata 0.10.9 / scikit-learn 1.6.1 / numba 0.60).
#
# Why the second command uses --no-deps: every dependency is already installed by this
# file, and rapids 24.12 (pylibcudf) needs pyarrow < 18, while every gtfparse release that
# pyensembl >= 2.3 accepts declares pyarrow >= 18 (or < 14.1) in its pip metadata. A
# dependency-resolving `pip install sampledisco` here would therefore replace conda's
# pyarrow and break cudf. (rapids-singlecell: --no-deps so it does not re-pull RAPIDS.)
#
# DRIVER NOTE: 24.12 is pinned (not 25.x) on purpose. The cluster's GPU nodes run
# driver 555.42.06 (CUDA 12.5); rapids 25.04+'s compiled libs need a newer driver
# (>= CUDA 12.6) and fail at import with `cudaErrorInsufficientDriver` on these
# nodes (verified on an A100 node). rapids 24.12 is built for CUDA 12.0-12.5 and
# runs on the 12.5 driver. On nodes with driver >= CUDA 12.6 you may bump to 25.x.
# scGLUE MUST come from pip, never bioconda (its recipe caps numpy<1.22).
name: sampledisco-gpu
channels:
  - rapidsai
  - conda-forge
  - bioconda
  - nvidia
  - defaults
dependencies:
  - python=3.10

  # --- RAPIDS 24.12 core (rapidsai channel, CUDA-12, driver-12.5 safe) ---
  - cuml=24.12
  - cudf=24.12
  - cugraph=24.12      # required by rapids-singlecell's GPU Leiden clustering
  - rmm=24.12
  - cuvs=24.12
  - cupy=13
  - cuda-version=12.5

  # --- code-sensitive pins (identical to the CPU env) ---
  - numpy=2.0.2
  - scanpy=1.11.4
  - anndata=0.10.9     # scGLUE 0.3.2 needs <0.11, MaxFuse 0.0.2 needs <0.13
  - scikit-learn=1.6.1
  - numba=0.60
  # pynndescent 0.7 / umap-learn 0.6 break sc.pp.neighbors (scanpy 1.11) on > ~8k cells
  - pynndescent<0.7
  - umap-learn<0.6

  # --- core scientific / single-cell stack ---
  - pandas
  - scipy
  - statsmodels
  - patsy
  - mudata
  - muon
  - harmonypy==0.2.0   # matches the package pin (requires torch)
  - python-igraph
  - leidenalg
  - networkx
  - pot
  - pygam
  - matplotlib
  - seaborn
  - pyyaml
  - psutil

  # --- genomics I/O + system binary ---
  - bedtools
  - htslib
  - pybedtools
  - pysam
  # multi-omics gene annotation. Pinned: rapids 24.12 needs pyarrow < 18, so gtfparse
  # must be 2.5.0 (every later conda build needs pyarrow >= 18), and conda's free pick
  # pyensembl 2.10.4 fails on it at import (cannot import GENCODE_BIOTYPE_ALIASES).
  - pyensembl=2.3.13
  - gtfparse=2.5.0

  # --- rapids-singlecell pure-Python deps (it's pip --no-deps above) ---
  - docrep
  - scikit-image       # also: scrublet-based ATAC doublet detection

  - pip
  - pip:
      # torch CUDA-12.1 wheel (coexists with cupy/cuml on the CUDA-12 ABI)
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      # pip-only deps (scGLUE must be pip, not bioconda):
      - scglue==0.3.2
      - harmony-pytorch==0.1.8
      - combat==0.3.3
      - adjustText==1.3.0
      - maxfuse==0.0.2         # RNA + protein/flow integration (needs anndata<0.13)
      # scikit-misc from pip: conda-forge's py3.10 builds report version 0.0.0 to pip
      - scikit-misc
      # NOTE: rapids-singlecell==0.13.1 and sampledisco==0.6.0 are installed by the
      # post-create command at the top (pip --no-deps; see there for why).
